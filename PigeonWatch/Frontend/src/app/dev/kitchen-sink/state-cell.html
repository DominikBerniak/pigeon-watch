<section class="cell" [attr.data-cell]="definition().id">
  <header class="cell__header pw-cluster">
    <h3 class="pw-subtitle">{{ definition().label }}</h3>
    @if (definition().dialog; as dialog) {
      <button mat-stroked-button type="button" [disabled]="running()" (click)="openDialog()">
        {{ dialog.action }}
      </button>
    }
    @if (definition().manual; as manual) {
      <button mat-stroked-button type="button" [disabled]="running()" (click)="runManual()">
        {{ manual.action }}
      </button>
    }
    @if (asksForLocationAgain()) {
      <label class="pw-cluster pw-text-small">
        Next "Locate me" answer
        <select (change)="chooseNextLocation($event)">
          @for (option of nextLocationOptions; track option.mode) {
            <option [value]="option.mode" [selected]="option.mode === nextLocation()">
              {{ option.label }}
            </option>
          }
        </select>
      </label>
    }
  </header>
  @switch (definition().group) {
    @case ('profile') {
      <app-profile-page />
    }
    @case ('nearbyMap') {
      <app-nearby-map-page />
    }
  }
</section>
