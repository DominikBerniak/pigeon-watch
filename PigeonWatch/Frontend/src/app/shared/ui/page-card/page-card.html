<mat-card appearance="outlined" class="page-card">
  <mat-card-content class="page-card__body">
    <header class="page-card__header">
      <div class="page-card__heading">
        <h1 #heading tabindex="-1" class="pw-title page-card__title">{{ title() }}</h1>
        @if (subtitle(); as text) {
          <p class="pw-text-muted">{{ text }}</p>
        }
      </div>
      <ng-content select="[headerActions]" />
    </header>
    <ng-content />
  </mat-card-content>
  <mat-card-actions class="page-card__actions">
    <ng-content select="[actions]" />
  </mat-card-actions>
</mat-card>
