<app-warmup-panel />

@if (currentUser(); as user) {
  <header class="app-header">
    <div class="pw-cluster app-header__bar">
      <a class="app-header__home" routerLink="/">
        <app-brand [name]="'common.appName' | translate" />
      </a>
      <div class="pw-cluster app-header__user">
        <button mat-stroked-button type="button" [matMenuTriggerFor]="userMenu">
          {{ user.displayName }}
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before">
          <a mat-menu-item routerLink="/sightings/new">{{ 'nav.reportSighting' | translate }}</a>
          <a mat-menu-item routerLink="/profile">{{ 'header.profile' | translate }}</a>
          <button mat-menu-item type="button" (click)="logout()">
            {{ 'header.logout' | translate }}
          </button>
        </mat-menu>
      </div>
    </div>
  </header>
}

<div class="app-body">
  <main
    class="app-main"
    [class.app-main--guest]="!currentUser()"
    [class.app-main--wide]="layout() === 'wide'"
    [class.app-main--roomy]="layout() === 'roomy'"
  >
    @if (!currentUser()) {
      <app-brand size="lg" [name]="'common.appName' | translate" />
    }
    <router-outlet />
  </main>
</div>
