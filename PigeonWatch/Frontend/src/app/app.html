<app-warmup-panel />

@if (currentUser(); as user) {
  <header class="app-header">
    <div class="pw-cluster app-header__bar">
      <a class="app-header__home" routerLink="/">
        <app-brand [name]="'common.appName' | translate" />
      </a>
      <div class="pw-cluster app-header__user">
        <a
          mat-icon-button
          class="app-header__report"
          routerLink="/sightings/new"
          [attr.aria-label]="'nav.reportSighting' | translate"
          [appTooltip]="'nav.reportSighting' | translate"
        >
          <app-icon name="report" size="lg" />
        </a>
        <app-messages-link [unreadCount]="unreadCount()" />
        <button
          mat-icon-button
          type="button"
          class="app-header__account"
          [matMenuTriggerFor]="userMenu"
          [attr.aria-label]="'header.accountMenu' | translate: user.displayName"
          [appTooltip]="'header.profile' | translate"
        >
          <app-icon name="user" size="lg" />
        </button>
        <mat-menu #userMenu="matMenu" class="pw-user-menu-panel" xPosition="before">
          <div class="app-header__menu-name">{{ user.displayName }}</div>
          <a mat-menu-item routerLink="/profile">{{ 'header.profile' | translate }}</a>
          <button mat-menu-item type="button" (click)="logout()">
            {{ 'header.logout' | translate }}
          </button>
        </mat-menu>
      </div>
    </div>
  </header>
}

<div class="app-body">
  <main
    class="app-main"
    [class.app-main--guest]="!currentUser()"
    [class.app-main--wide]="layout() === 'wide'"
    [class.app-main--roomy]="layout() === 'roomy'"
    [class.app-main--fill]="fill()"
  >
    @if (!currentUser()) {
      <app-brand size="lg" [name]="'common.appName' | translate" />
    }
    <router-outlet />
  </main>
</div>
