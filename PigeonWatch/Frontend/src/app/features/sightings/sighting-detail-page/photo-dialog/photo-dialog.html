<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <img class="photo-dialog__image" [src]="data.url" [alt]="data.alt" />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>
    {{ 'sighting.detail.photoClose' | translate }}
  </button>
</mat-dialog-actions>
