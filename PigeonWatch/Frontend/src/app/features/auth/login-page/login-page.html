<app-page-card
  [title]="'auth.login.title' | translate"
  [subtitle]="'auth.login.subtitle' | translate"
>
  <form class="pw-stack" [formRoot]="loginForm" (submit)="submit()">
    @if (notice(); as text) {
      <app-alert kind="success">{{ text }}</app-alert>
    }
    @if (formErrorText(); as text) {
      <app-alert kind="error">{{ text }}</app-alert>
    }
    <mat-form-field class="pw-full-width">
      <mat-label>{{ 'auth.fields.email' | translate }}</mat-label>
      <input matInput type="email" autocomplete="username" [formField]="loginForm.email" />
      <mat-error>
        <app-field-errors [field]="loginForm.email" [messages]="emailMessages()" />
      </mat-error>
    </mat-form-field>
    <mat-form-field class="pw-full-width">
      <mat-label>{{ 'auth.fields.password' | translate }}</mat-label>
      <input
        matInput
        type="password"
        autocomplete="current-password"
        [formField]="loginForm.password"
      />
      <mat-error>
        <app-field-errors [field]="loginForm.password" [messages]="passwordMessages()" />
      </mat-error>
    </mat-form-field>
    <app-submit-button [busy]="busy()">{{ 'auth.login.submit' | translate }}</app-submit-button>
  </form>
  <div actions class="pw-cluster pw-text-small">
    <span class="pw-text-muted">{{ 'auth.login.noAccount' | translate }}</span>
    <a mat-button routerLink="/register" queryParamsHandling="preserve">
      {{ 'auth.login.createAccount' | translate }}
    </a>
  </div>
</app-page-card>
