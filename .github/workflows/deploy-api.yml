name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'PigeonWatch/Api/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: pigeonwatch-api
  AZURE_WEBAPP_PACKAGE_PATH: PigeonWatch/Api/publish
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PigeonWatch/Api/PigeonWatchApi.csproj

      - name: Publish
        run: dotnet publish PigeonWatch/Api/PigeonWatchApi.csproj -c Release -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
