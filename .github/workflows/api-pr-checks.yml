name: API PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  architecture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build PigeonWatch/Api/PigeonWatchApi.slnx

      - name: Architecture tests
        run: dotnet test PigeonWatch/Api/ArchitectureTests/PigeonWatch.ArchitectureTests.csproj --no-build
